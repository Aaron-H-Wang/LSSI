[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lssi"
version = "0.2.0"
description = "Learnable Symbolic Sparse Identification of magnetic core loss"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Aaron H. Wang" }]
keywords = [
    "core loss",
    "magnetics",
    "power electronics",
    "sparse regression",
    "system identification",
    "physics-informed machine learning",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "torch>=2.0",
    "numpy>=1.23",
    "scipy>=1.9",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = ["lssi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
